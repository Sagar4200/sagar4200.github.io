<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career & Scheme Navigator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Glassmorphism utilities */
    .glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-dark {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    /* Floating AI avatar pulse */
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }
    .ai-pulse::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      background: linear-gradient(45deg, #667eea, #764ba2);
      z-index: -1;
      animation: pulse-ring 2s infinite;
    }
    /* Hide scrollbar for chat */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen font-inter">

  <!-- ==================== NAVBAR ==================== -->
  <nav class="glass sticky top-0 z-40 px-4 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎯</span>
        <h1 class="text-lg md:text-xl font-bold text-gray-800">Career & Scheme Navigator</h1>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <!-- Language Switcher -->
        <select id="languageSwitcher" class="text-sm bg-white/70 border border-gray-300 rounded-lg px-2 py-1 focus:ring-2 focus:ring-indigo-400 outline-none">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="bn">বাংলা</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option value="mr">मराठी</option>
        </select>
        <!-- Auth Buttons -->
        <button id="googleSignInBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-1.5 rounded-lg transition shadow">
          <i class="fab fa-google mr-1"></i> Sign in with Google
        </button>
        <button id="signOutBtn" class="hidden bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-1.5 rounded-lg transition shadow">
          Sign Out
        </button>
        <img id="navAvatar" class="hidden w-8 h-8 rounded-full border-2 border-indigo-300 object-cover" alt="Profile" />
      </div>
    </div>
  </nav>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 pb-24">

    <!-- ========== AUTH / WELCOME VIEW ========== -->
    <section id="welcomeView" class="text-center py-20">
      <h2 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4" data-i18n="welcomeTitle">Welcome to Career & Scheme Navigator</h2>
      <p class="text-lg text-gray-600 max-w-2xl mx-auto mb-8" data-i18n="welcomeSubtitle">
        Discover government schemes, scholarships, and jobs tailored to your profile. Sign in with Google to get started.
      </p>
      <button id="welcomeSignInBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-lg px-8 py-3 rounded-xl shadow-lg transition">
        Get Started with Google
      </button>
    </section>

    <!-- ========== DASHBOARD / PROFILE VIEW ========== -->
    <section id="dashboardView" class="hidden space-y-6">
      <!-- Profile Card -->
      <div class="glass rounded-2xl p-6 shadow-xl">
        <div class="flex flex-col md:flex-row items-start md:items-center gap-4">
          <div class="relative">
            <img id="profileAvatar" class="w-24 h-24 rounded-full border-4 border-white shadow-lg object-cover bg-gray-200" alt="Profile" />
            <input type="file" id="avatarUpload" accept="image/*" class="hidden" />
            <button id="uploadAvatarBtn" class="absolute bottom-0 right-0 bg-indigo-600 text-white rounded-full p-1.5 text-xs shadow" title="Upload photo">📷</button>
          </div>
          <div class="flex-1">
            <h3 id="profileName" class="text-2xl font-bold text-gray-800">Loading...</h3>
            <p id="profileEmail" class="text-sm text-gray-500"></p>
            <p class="text-xs text-indigo-600 mt-1" data-i18n="profileHint">Complete your profile to get accurate matches.</p>
          </div>
          <button id="editProfileBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm transition" data-i18n="editProfile">Edit Profile</button>
        </div>
      </div>

      <!-- Profile Form (collapsible) -->
      <div id="profileFormContainer" class="hidden glass rounded-2xl p-6 shadow-xl">
        <h3 class="text-xl font-bold mb-4" data-i18n="profileDetails">Profile Details</h3>
        <form id="profileForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-medium text-gray-600">Full Name</label>
            <input type="text" id="inputName" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" required />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Age</label>
            <input type="number" id="inputAge" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Date of Birth</label>
            <input type="date" id="inputDob" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Gender</label>
            <select id="inputGender" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">State</label>
            <select id="inputState" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
              <option value="">Select State</option>
              <option>West Bengal</option>
              <option>Delhi</option>
              <option>Maharashtra</option>
              <option>Tamil Nadu</option>
              <option>Karnataka</option>
              <option>Uttar Pradesh</option>
              <option>Bihar</option>
              <option>Rajasthan</option>
              <option>Gujarat</option>
              <option>Kerala</option>
              <option>Telangana</option>
              <option>Andhra Pradesh</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">District</label>
            <input type="text" id="inputDistrict" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., Kolkata" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Caste / Community</label>
            <select id="inputCaste" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none">
              <option value="">Select</option>
              <option>General</option>
              <option>OBC</option>
              <option>SC</option>
              <option>ST</option>
              <option>EWS</option>
              <option>Minority</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Class 10 Passing Year</label>
            <input type="number" id="inputClass10Year" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., 2020" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Class 10 Percentage</label>
            <input type="number" step="0.01" id="inputClass10Percent" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., 85.5" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Class 12 Passing Year</label>
            <input type="number" id="inputClass12Year" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., 2022" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Class 12 Percentage</label>
            <input type="number" step="0.01" id="inputClass12Percent" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., 78.0" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Highest Degree</label>
            <input type="text" id="inputHigherDegree" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., B.Tech" />
          </div>
          <div>
            <label class="text-xs font-medium text-gray-600">Higher Degree Percentage</label>
            <input type="number" step="0.01" id="inputHigherPercent" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="e.g., 8.2 CGPA" />
          </div>
          <div class="md:col-span-2 lg:col-span-3 flex justify-end gap-2 mt-2">
            <button type="button" id="cancelProfileBtn" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded-lg text-sm transition">Cancel</button>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm transition shadow">Save Profile</button>
          </div>
        </form>
      </div>

      <!-- Matched Opportunities -->
      <div>
        <h3 class="text-2xl font-bold text-gray-800 mb-4" data-i18n="matchedOpportunities">Matched Opportunities</h3>
        <div id="matchedContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Dynamic cards inserted here -->
        </div>
      </div>

      <!-- Section Tabs -->
      <div class="glass rounded-2xl p-6 shadow-xl">
        <div class="flex gap-2 border-b border-gray-200 pb-2 mb-4 flex-wrap">
          <button data-tab="schemes" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white" data-i18n="schemes">Schemes</button>
          <button data-tab="scholarships" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg bg-gray-200 text-gray-700" data-i18n="scholarships">Scholarships</button>
          <button data-tab="jobs" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg bg-gray-200 text-gray-700" data-i18n="jobs">Jobs</button>
          <button data-tab="prep" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg bg-gray-200 text-gray-700" data-i18n="preparation">Preparation Hub</button>
          <button data-tab="admin" id="adminTabBtn" class="hidden tab-btn px-4 py-2 text-sm font-medium rounded-lg bg-gray-200 text-gray-700">Admin AI</button>
        </div>
        <div id="tabContent" class="space-y-4">
          <!-- Dynamic content based on tab -->
        </div>
      </div>
    </section>
  </main>

  <!-- ==================== FLOATING AI ASSISTANT ==================== -->
  <div id="aiAssistantContainer" class="fixed bottom-6 right-6 z-50">
    <!-- Chat Window (hidden by default) -->
    <div id="aiChatWindow" class="hidden mb-4 w-80 md:w-96 glass-dark rounded-2xl shadow-2xl overflow-hidden">
      <div class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-xl">🤖</span>
          <span class="font-semibold text-sm">AI Assistant</span>
        </div>
        <button id="closeAiChat" class="text-white hover:text-gray-200 text-xl leading-none">&times;</button>
      </div>
      <div id="aiChatMessages" class="h-64 overflow-y-auto p-4 space-y-3 text-sm no-scrollbar"></div>
      <div class="p-3 border-t border-gray-600 flex gap-2">
        <input id="aiChatInput" type="text" placeholder="Ask about eligibility..." class="flex-1 px-3 py-2 bg-gray-700 text-white rounded-lg text-sm outline-none placeholder-gray-400" />
        <button id="aiSendBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">Send</button>
      </div>
    </div>
    <!-- Floating Avatar -->
    <button id="aiAvatarBtn" class="ai-pulse relative w-16 h-16 rounded-full gradient-bg text-white flex items-center justify-center text-2xl shadow-2xl hover:scale-105 transition">
      🤖
    </button>
  </div>

  <!-- ==================== SCRIPTS ==================== -->

    const SUPABASE_URL = 'https://kzbhpwtcsowzivgpellr.supabase.co';

    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    // Initialize Supabase client
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. INTERNATIONALIZATION (i18n)
    // ============================================================

        welcomeTitle: "கரியர் & திட்ட வழிகாட்டிக்கு வரவேற்கிறோம்",

      },
      te: {
        welcomeTitle: "కెరీర్ & స్కీమ్ నావిగేటర్కు స్వాగతం",
        welcomeSubtitle: "మీ ప్రొఫైల్కు తగిన ప్రభుత్వ పథకాలు, స్కాలర్షిప్లు మరియు ఉద్యోగాలను కనుగొనండి.",
        profileHint: "ఖచ్చితమైన మ్యాచ్ల కోసం మీ ప్రొఫైల్ను పూర్తి చేయండి.",

        preparation: "తయారీ కేంద్రం",
      },
      mr: {
        welcomeTitle: "करिअर आणि योजना नेव्हिगेटरमध्ये आपले स्वागत आहे",
        welcomeSubtitle: "तुमच्या प्रोफाइलनुसार सरकारी योजना, शिष्यवृत्ती आणि नोकऱ्या शोधा.",
        profileHint: "अचूक जुळणीसाठी तुमचे प्रोफाइल पूर्ण करा.",
        editProfile: "प्रोफाइल संपादित करा",
        profileDetails: "प्रोफाइल तपशील",
        matchedOpportunities: "जुळलेल्या संधी",
        schemes: "योजना",
        scholarships: "शिष्यवृत्ती",
        jobs: "नोकऱ्या",
        preparation: "तयारी केंद्र",
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      // Update dynamic content if needed
      if (currentUser) loadMatchedOpportunities();
    }

    document.getElementById('languageSwitcher').addEventListener('change', (e) => {
      applyLanguage(e.target.value);
    });

    // ============================================================
    // 3. SUPABASE AUTH & DATABASE
    // ============================================================
    let currentUser = null;

    // Sign in with Google
    async function signInWithGoogle() {
      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin,
        },
      });
      if (error) {
        console.error('Google sign-in error:', error);
        alert('Sign-in failed: ' + error.message);
      }
    }

    // Sign out
    async function signOut() {
      const { error } = await supabaseClient.auth.signOut();
      if (error) console.error('Sign-out error:', error);
    }

    // Listen for auth state changes
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (session?.user) {
        currentUser = session.user;
        showDashboard();
        await loadUserProfile();
        await loadMatchedOpportunities();
      } else {
        currentUser = null;
        showWelcome();
      }
    });

    // Check initial session
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        showDashboard();
        await loadUserProfile();
        await loadMatchedOpportunities();
      } else {
        showWelcome();
      }
    })();

    function showDashboard() {

    // Filter opportunities based on user profile
    function filterOpportunities(profile, type = null) {
      let filtered = mockOpportunities;
      if (type) filtered = filtered.filter(o => o.type === type);

      if (!profile) return filtered;

      return filtered.filter(o => {
        // State match
        if (o.state !== 'All' && profile.state && o.state !== profile.state) return false;
        // Caste match
        if (o.caste !== 'All' && profile.caste && o.caste !== profile.caste) return false;
        // Age match
        if (o.age_min != null && profile.age != null && profile.age < o.age_min) return false;
        if (o.age_max != null && profile.age != null && profile.age > o.age_max) return false;
        // Percentage match (use class 12 or higher)
        const userPercent = profile.class12_percentage || profile.higher_percentage;
        if (o.percentage_required != null && userPercent != null && userPercent < o.percentage_required) return false;
        return true;
      });
    }

    // ============================================================
    // 6. GEMINI AI HANDLERS

    // User AI Assistant
    async function callGeminiUser(prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY_USER}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
        }),
      });
      if (!res.ok) throw new Error(`Gemini API error: ${res.status}`);
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text ?? 'No response.';
    }

    // Admin AI Parser
    async function callGeminiAdmin(text) {
      const prompt = `You are an AI that extracts structured JSON from unstructured Indian government scheme/job/scholarship text.
Return ONLY valid JSON with these fields: type ("scheme"|"scholarship"|"job"), title, description, state (or "All"), caste (or "All"), age_min (number or null), age_max (number or null), percentage_required (number or null), official_link, benefits, cutoff_previous_year.
Do not include markdown or extra text.
Text: "${text}"`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY_ADMIN}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
        }),
      });
      if (!res.ok) throw new Error(`Gemini Admin API error: ${res.status}`);
      const data = await res.json();
      const raw = data.candidates?.[0]?.content?.parts?.[0]?.text ?? '';
      // Clean and parse JSON
      const clean = raw.replace(/```json|```/g, '').trim();
      return JSON.parse(clean);
    }

    async function sendAiMessage() {
      const input = document.getElementById('aiChatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addAiMessage('user', text);
      addAiMessage('bot', 'Thinking...');

      try {
        const response = await callGeminiUser(text);
        // Remove "Thinking..." message
        aiChatMessages.lastElementChild.remove();
        addAiMessage('bot', response);
      } catch (err) {
        aiChatMessages.lastElementChild.remove();
        addAiMessage('bot', '⚠️ Error: ' + err.message);
      }
    }

    function addAiMessage(sender, text) {
      const div = document.createElement('div');
      div.className = sender === 'user' ? 'text-right' : 'text-left';
      div.innerHTML = `
        <span class="inline-block px-3 py-2 rounded-lg text-sm ${sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-white'}">
