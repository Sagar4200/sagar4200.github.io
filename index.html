<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex3 - Secure Google Auth Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wide text-cyan-400">Ex3 Project Portal</h1>
            <p class="text-xs text-slate-400 mt-1">One-click secure login with Google</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-6 text-slate-400">
            Checking session...
        </div>

        <!-- Login Container (Shown when logged out) -->
        <div id="auth-container" class="hidden space-y-4 text-center">
            <div class="p-4 bg-slate-800/40 border border-slate-800 rounded-xl text-xs text-slate-300">
                No passwords needed! Click below to securely sign in using your Google account.
            </div>

            <div id="error-msg" class="text-red-400 text-xs hidden"></div>
            
            <!-- Google Sign-In Button -->
            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 rounded-xl text-sm transition-all shadow-lg cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c-.07-.8-.64-1.54-1.44-1.77H12v4.51h6.61c-.29 1.54-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.65-5.17 3.65-8.82z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.18 21.31 7.24 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.39-1.49-.39-2.25s.14-1.53.39-2.25V6.6H1.2C.44 8.15 0 9.9 0 12s.44 3.85 1.2 5.4l4.08-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.76 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.69 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- Dashboard View (Shown when logged in) -->
        <div id="dashboard-container" class="hidden space-y-6 text-center">
            <div class="p-4 bg-slate-800/50 border border-slate-800 rounded-xl">
                <p class="text-xs text-slate-400">Logged in Google Account:</p>
                <p id="user-email" class="text-sm font-medium text-cyan-300 mt-1 break-all"></p>
            </div>
            
            <div class="p-4 bg-emerald-950/20 border border-emerald-900/40 rounded-xl text-emerald-400 text-xs">
                ✅ Session is active. You are successfully logged in via Supabase cloud auth!
            </div>

            <button onclick="handleLogout()" class="w-full bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-900/50 font-semibold py-2.5 rounded-xl text-sm transition-all cursor-pointer">
                Logout
            </button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Supabase Config for Ex3 Project
        const SUPABASE_URL = 'https://kzbhpwtcsowzivgpellr.supabase.co';
        const SUPABASE_ANON_KEY = 'TOR_SUPABASE_PUBLISHABLE_KEY_EKHANE_BOSABI'; // Tor publishable key ekhane bosabi

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loadingEl = document.getElementById('loading');
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const userEmailEl = document.getElementById('user-email');
        const errorMsgEl = document.getElementById('error-msg');

        // Check active session on load
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            manageView(session);

            _supabase.auth.onAuthStateChange((event, session) => {
                manageView(session);
            });
        }

        function manageView(session) {
            loadingEl.classList.add('hidden');
            if (session) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userEmailEl.textContent = session.user.email;
            } else {
                dashboardContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
            }
        }

        // Trigger Google OAuth Sign-in
        async function handleGoogleLogin() {
            clearError();
            const { data, error } = await _supabase.auth.signInWithOAuth({
                provider: 'google'
            });
            if (error) {
                showError(error.message);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
        }

        function showError(msg) {
            errorMsgEl.textContent = msg;
            errorMsgEl.classList.remove('hidden');
        }

        function clearError() {
            errorMsgEl.textContent = '';
            errorMsgEl.classList.add('hidden');
        }

        window.onload = checkSession;
    </script>
</body>
</html>
